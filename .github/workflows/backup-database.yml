name: Daily database backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: true

jobs:
  backup:
    name: Backup production database
    runs-on: ubuntu-24.04
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16

      - name: Dump database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          FILENAME="backup_$(date +%Y%m%d_%H%M%S).dump"
          pg_dump \
            --host="db.${SUPABASE_PROJECT_ID}.supabase.co" \
            --port=5432 \
            --username=postgres \
            --dbname=postgres \
            --format=custom \
            --file="${FILENAME}"
          echo "BACKUP_FILE=${FILENAME}" >> $GITHUB_ENV

      - name: Verify backup
        run: |
          ENTRY_COUNT=$(pg_restore --list "${BACKUP_FILE}" | grep -c '^[0-9]' || true)
          echo "Backup contains ${ENTRY_COUNT} entries"
          test "${ENTRY_COUNT}" -gt 0

      - name: Encrypt backup
        env:
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          echo "${PASSPHRASE}" | gpg --batch --yes --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            "${BACKUP_FILE}"
          rm "${BACKUP_FILE}"
          echo "BACKUP_FILE=${BACKUP_FILE}.gpg" >> $GITHUB_ENV

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 7

      - name: Notify on failure
        if: failure() || cancelled()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Database backup failed — ${{ github.repository }}"
          to: lfryemason@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            The daily database backup workflow failed.

            Repository: ${{ github.repository }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
