name: Daily database backup

on:
  schedule:
    - cron: "0 6 * * *" # 2am EDT (UTC-4) = 6am UTC
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: true

jobs:
  backup:
    # HOW TO RESTORE THIS BACKUP
    #
    # 1. Find the artifact
    #    Go to Actions → select the workflow run → download the artifact named
    #    "db-backup-<run-id>". Alternatively, use the GitHub CLI:
    #
    #      gh run download <run-id> --name db-backup-<run-id>
    #
    # 2. Decrypt the backup
    #    You will need the BACKUP_ENCRYPTION_PASSPHRASE secret (retrieve it from
    #    the repo secrets or your password manager):
    #
    #      gpg --batch --passphrase "YOUR_PASSPHRASE" \
    #        --pinentry-mode loopback \
    #        --decrypt backup_YYYYMMDD_HHMMSS.dump.gpg > backup.dump
    #
    # 3. Spin up a target database
    #    For a local test restore, a throwaway Docker container works well:
    #
    #      docker run -d --name pg-restore-test \
    #        -e POSTGRES_PASSWORD=test \
    #        -p 5433:5432 \
    #        postgres:17
    #
    #    For a real disaster-recovery restore, target your new Supabase project's
    #    direct connection string (found in Supabase dashboard → Settings → Database).
    #
    # 4. Restore
    #    --no-owner and --no-acl are required when restoring into a vanilla Postgres
    #    instance or a fresh Supabase project, because Supabase-specific roles from
    #    the source project do not exist in the target:
    #
    #      PGPASSWORD=test pg_restore \
    #        --host=localhost --port=5433 \
    #        --username=postgres --dbname=postgres \
    #        --no-owner --no-acl \
    #        --format=custom \
    #        backup.dump
    #
    #    Expect some "role does not exist" warnings for Supabase internal roles — these
    #    are safe to ignore as long as the restore exits 0 or with only warnings.
    #
    # 5. Verify
    #    Spot-check that key data arrived:
    #
    #      psql -h localhost -p 5433 -U postgres \
    #        -c "\dn"                                          # should show auth, public, storage
    #      psql -h localhost -p 5433 -U postgres \
    #        -c "SELECT count(*) FROM auth.users;"
    #      psql -h localhost -p 5433 -U postgres \
    #        -c "SELECT count(*) FROM public.<your_main_table>;"
    #
    # 6. Cleanup (local test only)
    #
    #      docker rm -f pg-restore-test
    #      rm backup.dump
    #
    name: Backup production database
    runs-on: ubuntu-24.04
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          FILENAME="backup_$(date +%Y%m%d_%H%M%S).dump"
          pg_dump \
            --host="${{ secrets.SUPABASE_DB_HOST }}" \
            --port=5432 \
            --username="${{ secrets.SUPABASE_DB_USER }}" \
            --dbname=postgres \
            --format=custom \
            --file="${FILENAME}"
          echo "BACKUP_FILE=${FILENAME}" >> $GITHUB_ENV

      - name: Verify backup
        run: |
          ENTRY_COUNT=$(pg_restore --list "${BACKUP_FILE}" | grep -c '^[0-9]' || true)
          echo "Backup contains ${ENTRY_COUNT} entries"
          test "${ENTRY_COUNT}" -gt 0

      - name: Encrypt backup
        env:
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          if [ -z "${PASSPHRASE}" ]; then
            echo "BACKUP_ENCRYPTION_PASSPHRASE secret is not set or empty" >&2
            exit 1
          fi
          echo "${PASSPHRASE}" | gpg --batch --yes --passphrase-fd 0 \
            --pinentry-mode loopback \
            --symmetric --cipher-algo AES256 \
            "${BACKUP_FILE}"
          rm "${BACKUP_FILE}"
          echo "BACKUP_FILE=${BACKUP_FILE}.gpg" >> $GITHUB_ENV

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 7

      - name: Notify on failure
        if: failure() || cancelled()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Database backup failed — ${{ github.repository }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            The daily database backup workflow failed.

            Repository: ${{ github.repository }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
